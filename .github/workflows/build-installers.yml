# Сборка установщиков русской версии HHsim для Windows и macOS.
#
# Запуск: вкладка Actions -> «Сборка установщиков» -> Run workflow,
# либо push тега вида v3.7-ru (тогда файлы публикуются в GitHub Release).
#
# Для компиляции нужен MATLAB Compiler, который не входит в бесплатную
# лицензию MATLAB для публичных проектов на GitHub Actions. Поэтому в
# настройках репозитория (Settings -> Secrets and variables -> Actions)
# нужно создать секрет MLM_LICENSE_TOKEN с batch-токеном MathWorks для
# лицензии, включающей MATLAB Compiler. Подробнее — в packaging/README.md.

name: Сборка установщиков

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  source:
    name: Архив исходного кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Упаковать исходный код
        run: |
          mkdir -p dist stage/hhsim_37ru
          cp -r code stage/hhsim_37ru/code
          (cd stage && zip -qr ../dist/HHsim-3.7-ru-source.zip hhsim_37ru)
      - uses: actions/upload-artifact@v4
        with:
          name: HHsim-source
          path: dist/*

  installers:
    name: Установщик (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    steps:
      - name: Проверить наличие лицензионного токена
        shell: bash
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
        run: |
          if [ -z "$MLM_LICENSE_TOKEN" ]; then
            echo "::error::Не задан секрет MLM_LICENSE_TOKEN. Без лицензии MATLAB Compiler собрать установщик нельзя (см. packaging/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          products: MATLAB_Compiler

      - name: Собрать установщик
        uses: matlab-actions/run-command@v2
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
        with:
          command: addpath('packaging'); build_installers('dist');

      - uses: actions/upload-artifact@v4
        with:
          name: HHsim-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    name: Публикация выпуска
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: HHsim ${{ github.ref_name }} (русская версия)
          files: dist/*
          body: |
            Русская версия HHsim — графического симулятора Ходжкина–Хаксли.

            * **Windows:** HHsim-3.7-ru-Windows-Installer.exe
            * **macOS (Apple Silicon):** HHsim-3.7-ru-macOS-AppleSilicon-Installer.zip
            * **macOS (Intel):** HHsim-3.7-ru-macOS-Intel-Installer.zip
            * **Исходный код MATLAB (R2020a+):** HHsim-3.7-ru-source.zip

            Установщикам не нужна лицензия MATLAB: во время установки они скачивают
            бесплатную среду MATLAB Runtime (нужно подключение к Интернету).
            Инструкции по установке: https://github.com/rem-aster/HHsim#установка
